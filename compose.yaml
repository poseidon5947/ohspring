services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: absystems
      POSTGRES_USER: absystems
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U absystems]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/absystems
      DATABASE_USER: absystems
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8080
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres-data:
