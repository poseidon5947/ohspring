spring.application.name=ab-systems-tech
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/absystems}
spring.datasource.username=${DATABASE_USER:absystems}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.timeout=30m
server.error.include-message=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
